name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: bash -n run-collect.sh
      - run: npm test
      - run: npm run test:runner
      - run: npm run build:data
      - run: npm run build:web
      - run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: roomgap-site
          path: dist/
          retention-days: 7
