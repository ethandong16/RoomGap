// Rebuild binary package caches in memory instead of persisting ~80 MiB on disk.
// Administrator: install as /etc/apt/apt.conf.d/99roomgap-small-disk.
Dir::Cache::pkgcache "";
Dir::Cache::srcpkgcache "";
APT::Keep-Downloaded-Packages "false";
Binary::apt-get::APT::Keep-Downloaded-Packages "false";
